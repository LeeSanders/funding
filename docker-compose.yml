version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: funding-postgres
    environment:
      POSTGRES_DB: funding
      POSTGRES_USER: funding
      POSTGRES_PASSWORD: funding
    ports:
      - "5432:5432"
    volumes:
      - funding_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: funding-redis
    ports:
      - "6379:6379"
    volumes:
      - funding_redis_data:/data

volumes:
  funding_postgres_data:
  funding_redis_data:
